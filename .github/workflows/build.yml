name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'verity-fabric-starter.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -o verity-fabric-starter.zip -d project
          find project -type f -name gradlew -exec chmod +x {} +

      - name: Build with Gradle
        working-directory: project/verity-fabric-starter
        run: ./gradlew build --no-daemon

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: verity-fabric-build
          path: project/verity-fabric-starter/build/libs/*.jar
